<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile | PERYA DICE</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="notifications.css">
<style>
.profilePictureEditor{display:grid;gap:14px;margin:18px 0 24px;padding:16px;border:1px solid rgba(255,255,255,.14);border-radius:16px;background:rgba(0,0,0,.18)}
.profilePictureCurrent{display:flex;align-items:center;gap:15px}.profilePictureCurrent h2{margin:0 0 5px;font-size:18px}.profilePictureCurrent p{margin:0}.profilePhotoActions{display:flex;flex-wrap:wrap;gap:10px}.profilePhotoActions button{width:auto;margin:0}.dangerButton{border-color:rgba(255,100,100,.4);color:#ffd1d1}.profileCropControls{display:grid;justify-items:center;gap:12px}.profileCropControls>p{margin:0}.profileCropControls canvas{display:block;width:min(360px,100%);height:auto;aspect-ratio:1;border:2px solid rgba(255,255,255,.18);border-radius:50%;background:#151925;cursor:grab;touch-action:none;box-shadow:0 12px 30px rgba(0,0,0,.3)}.profileCropControls canvas.dragging{cursor:grabbing}.profileZoomControl{display:grid;grid-template-columns:auto minmax(180px,320px);align-items:center;gap:12px;width:min(420px,100%)}.profileZoomControl input{width:100%}@media(max-width:560px){.profilePictureCurrent{align-items:flex-start}.profilePictureCurrent .profilePhoto{width:78px;height:78px}.profilePhotoActions{display:grid;grid-template-columns:1fr}.profilePhotoActions button{width:100%}}
</style>
</head>
<body class="profilePage editProfileTheme">
    <header class="siteHeader accountOnlyHeader">
        <div id="notificationRoot" class="notificationRoot" hidden>
            <button
                id="notificationButton"
                class="notificationButton"
                type="button"
                aria-label="Open notifications"
                aria-expanded="false"
                aria-controls="notificationPanel"
            >
                <span class="notificationBell" aria-hidden="true">🔔</span>
                <span id="notificationBadge" class="notificationBadge" hidden>0</span>
            </button>

            <section id="notificationPanel" class="notificationPanel" aria-label="Notifications" hidden>
                <div class="notificationPanelHeader">
                    <div>
                        <h2>Notifications</h2>
                        <p id="notificationSummary">No unread notifications</p>
                    </div>
                    <button id="closeNotificationsButton" class="notificationIconButton" type="button" aria-label="Close notifications">×</button>
                </div>

                <div class="notificationToolbar">
                    <button id="markAllNotificationsReadButton" class="notificationToolbarButton" type="button">✓ Mark all read</button>
                    <button id="clearNotificationsButton" class="notificationToolbarButton dangerNotificationAction" type="button">🗑 Clear all</button>
                </div>

                <p id="notificationMessage" class="notificationMessage"></p>
                <div id="notificationList" class="notificationList" aria-live="polite"></div>
            </section>
        </div>

        <div id="accountMenuRoot" class="accountMenu" hidden>
            <button class="accountMenuButton" type="button" data-account-button aria-label="Open account menu" aria-expanded="false">
                <img class="accountAvatar" data-account-avatar src="favicon.png" alt="Profile picture">
            </button>
            <div class="accountDropdown" data-account-dropdown hidden>
                <p class="accountMenuName" data-account-username>@user</p>
                <a data-my-profile href="#">👤 My Profile</a>
<a href="profile_search.html">🔍 Find Profiles</a>
                <a data-admin-link href="pdo_hub.html" hidden>🛠 Admin Panel</a>
                <button type="button" data-account-signout>🚪 Sign Out</button>
            </div>
        </div>
    </header>

    <main class="profileShell">
        <a class="secondaryButton profileBackButton" href="dashboard.html">← Dashboard</a>

        <section class="publicProfileCard editProfileCard">
            <h1>Edit Profile</h1>

            <div class="profilePictureEditor">
                <div class="profilePictureCurrent">
                    <img id="editProfilePreview" class="profilePhoto" src="favicon.png" alt="Current profile picture">
                    <div>
                        <h2>Profile Picture</h2>
                        <p class="mutedText">Upload PNG, JPG, or WebP. It will be cropped to a square and saved as an optimized WebP image.</p>
                    </div>
                </div>

                <input id="profilePhotoInput" type="file" accept="image/png,image/jpeg,image/webp,.png,.jpg,.jpeg,.webp" hidden>

                <div class="profilePhotoActions">
                    <button id="chooseProfilePhotoButton" type="button" class="secondaryButton">Choose Picture</button>
                    <button id="removeProfilePhotoButton" type="button" class="secondaryButton dangerButton">Use Google Picture</button>
                </div>

                <section id="profileCropControls" class="profileCropControls" hidden>
                    <p class="mutedText">Drag the image to reposition it.</p>
                    <canvas id="profileCropCanvas" width="360" height="360" aria-label="Profile picture crop preview"></canvas>
                    <label class="profileZoomControl" for="profilePhotoZoom">
                        <span>Zoom</span>
                        <input id="profilePhotoZoom" type="range" min="1" max="3" step="0.01" value="1">
                    </label>
                    <button id="resetProfileCropButton" type="button" class="secondaryButton">Reset Position</button>
                </section>
            </div>

            <form id="editProfileForm">
                <div class="formGroup">
                    <label for="profileBioInput">Bio</label>
                    <textarea id="profileBioInput" maxlength="300" placeholder="Tell visitors about your livestreams..."></textarea>
                    <p id="bioCount" class="reviewCharacterCount">0 / 300</p>
                </div>

                <div class="buttonRow">
                    <button id="saveProfileButton" type="submit">Save Profile</button>
                    <a id="cancelEditProfile" class="secondaryButton" href="dashboard.html">Cancel</a>
                </div>

                <p id="editProfileMessage" class="joinMessage" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <script type="module" src="edit_profile.js"></script>
    <script type="module" src="notifications.js"></script>
    <script type="module" src="account-menu.js"></script>
</body>
</html>
