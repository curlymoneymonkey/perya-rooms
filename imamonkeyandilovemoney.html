<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Perya Dice Room Access</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="imamonkeyandilovemoney.css">

    <style>
        .roomAccessTools {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 12px 0;
        }

        #keybindSettingsButton,
        .keybindModalButton,
        .keybindCaptureButton {
            border: 0;
            border-radius: 10px;
            padding: 9px 13px;
            font-weight: 800;
            cursor: pointer;
        }

        #keyboardStatus {
            min-width: 150px;
            text-align: center;
            font-weight: 900;
        }

        #keyboardStatus.isOn {
            color: #76ff91;
        }

        #keyboardStatus.isOff {
            color: #b8b8b8;
        }

        .keybindModal {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: grid;
            place-items: center;
            padding: 16px;
            background: rgba(0, 0, 0, 0.72);
        }

        .keybindModal[hidden] {
            display: none;
        }

        .keybindModalPanel {
            width: min(520px, 100%);
            max-height: min(720px, calc(100vh - 32px));
            overflow-y: auto;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 18px;
            background: #171717;
            box-shadow: 0 18px 55px rgba(0, 0, 0, 0.55);
        }

        .keybindModalHeader {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }

        .keybindModalHeader h2 {
            margin: 0;
        }

        #closeKeybindModalButton {
            width: 40px;
            height: 40px;
            padding: 0;
            border-radius: 50%;
            font-size: 22px;
        }

        .keybindRow {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            padding: 9px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.09);
        }

        .keybindCaptureButton {
            min-width: 120px;
        }

        .keybindEnabledRow {
            display: flex;
            align-items: center;
            gap: 9px;
            margin: 16px 0;
            font-weight: 800;
        }

        .keybindModalActions {
            display: flex;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 9px;
            margin-top: 14px;
        }

        #keybindMessage {
            min-height: 22px;
            margin: 12px 0 0;
            text-align: center;
            color: #ffd95a;
            font-weight: 800;
        }

        .roomAccessToast {
            position: fixed;
            right: 18px;
            bottom: 18px;
            z-index: 11000;
            max-width: min(360px, calc(100vw - 36px));
            padding: 11px 15px;
            border-radius: 11px;
            background: rgba(20, 20, 20, 0.95);
            color: #ffffff;
            font-weight: 900;
            opacity: 0;
            pointer-events: none;
            transform: translateY(12px);
            transition: opacity 160ms ease, transform 160ms ease;
        }

        .roomAccessToast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .roomAccessToast.isError {
            color: #ff9292;
        }

        body.modalOpen {
            overflow: hidden;
        }

        @media (max-width: 520px) {
            .keybindRow {
                align-items: stretch;
                flex-direction: column;
            }

            .keybindCaptureButton {
                width: 100%;
            }

            .keybindModalActions {
                flex-direction: column;
            }

            .keybindModalActions button {
                width: 100%;
            }
        }
            .saveChangesWrap {
            display: flex;
            justify-content: center;
            margin-top: 14px;
        }

        #saveChangesButton {
            padding: 11px 18px;
            border: 0;
            border-radius: 11px;
            font-weight: 900;
            cursor: pointer;
        }

        #saveChangesButton:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }
    
        /* Ball Drop future-result editor */
        .ballDropAdminPreview {
            width: 42px;
            height: 42px;
            display: block;
            border: 2px solid rgba(255,255,255,.72);
            border-radius: 50%;
            box-shadow: inset -6px -7px 10px rgba(0,0,0,.2);
        }
        .ballDropAdminPreview.purple { background: #8e44ad; }
        .ballDropAdminPreview.yellow { background: #f1c40f; }
        .ballDropAdminPreview.red { background: #e74c3c; }
        .ballDropAdminPreview.green { background: #2ecc71; }
        .ballDropAdminPreview.orange { background: #e67e22; }
        .ballDropAdminPreview.blue { background: #3498db; }
        .ballDropFutureRow { align-items: flex-end; }
        .ballDropBallEditor select { min-width: 92px; }

    </style>
</head>
<body>
    <main id="roomAccessChecking" class="reviewQueueNotice" aria-live="polite"></main>

    <main id="roomAccessPanel" hidden>
        <h1 aria-label="Room Access">🎲</h1>

        <section class="roomAccessBox" aria-labelledby="roomAccessTitle">
            <header class="roomAccessHeader">
                <h2 id="roomAccessTitle"></h2>
                <p></p>
            </header>

            <div class="roomSummary" aria-live="polite">
                <h3 id="roomStatus"></h3>
                <p id="roomIdentity"></p>
            </div>

            <div class="roomAccessTools">
                <button id="keybindSettingsButton" type="button">⌨ Keybind Settings</button>
                <span id="keyboardStatus" class="isOff" aria-live="polite">⌨ Keyboard: OFF</span>
            </div>

            <div id="rollContainer"></div>
            <div class="saveChangesWrap">
                <button id="saveChangesButton" type="button" disabled>💾 Save Changes</button>
            </div>
            <p id="saveStatus" aria-live="polite"></p>
        </section>
    </main>

    <div id="keybindModal" class="keybindModal" hidden>
        <section
            id="keybindModalPanel"
            class="keybindModalPanel"
            role="dialog"
            aria-modal="true"
            aria-labelledby="keybindModalTitle"
        >
            <header class="keybindModalHeader">
                <h2 id="keybindModalTitle">⌨ Keybind Settings</h2>
                <button
                    id="closeKeybindModalButton"
                    class="keybindModalButton"
                    type="button"
                    aria-label="Close keybind settings"
                >×</button>
            </header>

            <div id="keybindRows"></div>

            <label class="keybindEnabledRow">
                <input id="keyboardEnabledCheckbox" type="checkbox">
                Enable keyboard shortcuts
            </label>

            <p id="keybindMessage" aria-live="polite"></p>

            <div class="keybindModalActions">
                <button
                    id="restoreDefaultKeybindsButton"
                    class="keybindModalButton"
                    type="button"
                >Restore Defaults</button>
                <button
                    class="keybindModalButton"
                    type="button"
                    onclick="document.getElementById('closeKeybindModalButton').click()"
                >Close</button>
            </div>
        </section>
    </div>

    <div id="roomAccessToast" class="roomAccessToast" aria-live="polite"></div>

    <script type="module" src="imamonkeyandilovemoney.js"></script>
</body>
</html>
